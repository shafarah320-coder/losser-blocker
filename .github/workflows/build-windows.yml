
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless
          pip install "numpy<2" opencv-python==4.10.0.84
          pip install pyinstaller

      - name: Verify OpenCV
        run: |
          python -c "import cv2; print(cv2.__version__); assert hasattr(cv2, 'CascadeClassifier'), 'CascadeClassifier missing'"

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ScreenCensor --collect-all cv2 screen_censor.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCensor-Windows-Installer-v3
          path: Output/ScreenCensor_Setup.exe
